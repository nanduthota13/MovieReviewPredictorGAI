<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Review Analyzer - Login</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 32px;
        width: 360px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }
      input, button { width: 100%; padding: 12px; border-radius: 10px; border: none; margin-top: 10px; }
      button { background: #f59e0b; color: white; font-weight: bold; cursor: pointer; }
      a { color: #fde68a; text-decoration: none; display: block; margin-top: 12px; }
      .error { color: #fecaca; margin-top: 8px; }
      .success { color: #bbf7d0; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login</h2>
      <form method="post">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      {% if message %}<div class="success">{{ message }}</div>{% endif %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <a href="{{ url_for('signup') }}">Create an account</a>
    </div>
  </body>
</html>
